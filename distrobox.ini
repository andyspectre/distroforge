# tags: kali
[kalitest-distrobox]
home="${HOME}"/Distrobox/kalitest-distrobox
hostname="$(uname -n)"
image=docker.io/kalilinux/kali-rolling:latest
additional_flags="-p=8400:8400"
unshare_netns=true
replace=true
start_now=true

