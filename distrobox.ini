# tags: generic postgresql
[postgresql-distrobox]
home="${HOME}"/Distrobox/postgresql-distrobox
hostname="$(uname -n)"
image=quay.io/toolbx-images/debian-toolbox:12
# additional_flags="-p=5432:5432"
additional_packages="systemd libpam-systemd pipewire-audio-client-libraries"
# unshare_netns=true
init=true
replace=true
start_now=true

